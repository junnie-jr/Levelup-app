<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Level UP</title>
<meta name="theme-color" content="#000000"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Level UP"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0c0c0e;--ln:#1e1e22;--p:#dda1a1;--s:#78a7da;--t:#ececec;--m:#8a8a92;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 Inter,system-ui,sans-serif}
body{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
h1,h2,h3,.o{font-family:Orbitron,Inter,sans-serif;font-weight:500;letter-spacing:.02em;margin:0}
#v{padding:16px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.top img{width:44px;height:44px;border-radius:12px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.c.g{box-shadow:0 0 14px #78a7da22;border-color:#78a7da44}
.m{color:var(--m);font-size:13px}.r{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.w{flex-wrap:wrap}
input,select,button{font:inherit;color:var(--t);background:#000;border:1px solid var(--ln);border-radius:10px;padding:9px 10px;min-width:0}
input{width:100%}input:focus,select:focus{outline:1px solid var(--s)}
button{cursor:pointer;background:var(--card)}button.p{border-color:var(--p);color:var(--p)}button.s{border-color:var(--s);color:var(--s);box-shadow:0 0 8px #78a7da33}
.big{font:700 28px Orbitron,sans-serif;color:var(--s)}.bar{height:6px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--s);box-shadow:0 0 8px #78a7da88}
nav{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding:0 14px;pointer-events:none;z-index:5}
nav div{pointer-events:auto;display:flex;width:100%;max-width:460px;padding:6px;gap:2px;border-radius:32px;background:linear-gradient(135deg,#ffffff24,#ffffff08 60%,#78a7da10);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid #ffffff2e;box-shadow:inset 0 1px 0 #ffffff45,inset 0 -8px 16px #00000040,0 12px 32px #000c}nav button{flex:1;border:0;background:none;color:#c4c4cc;padding:11px 2px;font-size:12px;border-radius:26px;transition:background .25s,color .25s,box-shadow .25s}nav button.on{background:linear-gradient(180deg,#78a7da30,#78a7da14);color:var(--s);box-shadow:inset 0 0 0 1px #78a7da55,inset 0 1px 0 #ffffff30,0 0 10px #78a7da33}
nav button.plus{color:var(--p);font:700 26px Orbitron;padding:6px}
.rk{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.rn{overflow-wrap:normal;word-break:normal;hyphens:none;text-wrap:balance}.nw{white-space:nowrap}
.ov{position:fixed;inset:0;background:#000e;z-index:9;overflow:auto;padding:20px;display:flex;flex-direction:column;align-items:center}
.ov img{max-width:100%;background:#222}.chip{padding:5px 10px;border-radius:20px;font-size:13px}.chip.on{border-color:var(--p);color:var(--p)}
.set{display:grid;grid-template-columns:30px 1fr 1fr 34px;gap:6px;margin-top:6px;align-items:center}.spl{justify-content:center;text-align:center;background:#000}@keyframes pul{50%{transform:scale(1.07)}}@keyframes ld{to{width:100%}}@keyframes lose{0%{transform:none}25%{transform:rotate(-14deg) scale(1.1)}50%{transform:rotate(12deg)}100%{transform:translateY(46px) rotate(8deg) scale(.7);filter:grayscale(1) brightness(.5);opacity:.45}}.pl{animation:pul 1.6s infinite;filter:drop-shadow(0 0 8px #dda1a177)}.lost{animation:lose 1.6s forwards}@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body><div id="v"></div><nav><div id="nv"></div></nav>
