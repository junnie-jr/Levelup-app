name: Build release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (example: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-192.png icon-512.png www/
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js#supabase.js#' www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          mkdir -p android/app/src/main/java/com/junnie/levelup
          cp native/GalleryPlugin.java native/MainActivity.java android/app/src/main/java/com/junnie/levelup/
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          f = '''<intent-filter>
              <action android:name="android.intent.action.VIEW"/>
              <category android:name="android.intent.category.DEFAULT"/>
              <category android:name="android.intent.category.BROWSABLE"/>
              <data android:scheme="com.junnie.levelup" android:host="auth"/>
          </intent-filter>'''
          s = s.replace('</activity>', f + '\n</activity>', 1)
          s = s.replace('<application', '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application', 1)
          open(p, 'w').write(s)
          PY
          VER="${{ inputs.version }}"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${VER#v}\"/" android/app/build.gradle

      - name: Generate app icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b0b0a' --splashBackgroundColor '#0b0b0a'

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build unsigned APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          UNSIGNED=$(find android/app/build/outputs/apk/release -name '*unsigned*.apk' | head -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p 4 "$UNSIGNED" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" --out "LevelUP-${{ inputs.version }}.apk" aligned.apk
          rm release.keystore

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Level UP ${{ inputs.version }}
          files: LevelUP-${{ inputs.version }}.apk
          generate_release_notes: true
